name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.8.0)'
        required: true

permissions:
  contents: write

env:
  GO_VERSION: '1.26'
  JAVA_VERSION: '8'

jobs:
  # ============== Java JAR ==============
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JARs
        run: mvn clean package -DskipTests

      - name: Upload Java artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-artifacts
          path: |
            rpt-server/target/rpt-server-*.jar
            rpt-client/target/rpt-client-*.jar

  # ============== Go CLI Client ==============
  build-go-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          # OpenWrt targets
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            suffix: ''
          - goos: linux
            goarch: mips
            gomips: softfloat
            suffix: ''
          - goos: linux
            goarch: arm
            goarm: '7'
            suffix: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        working-directory: rpt-client-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
          GOMIPS: ${{ matrix.gomips || '' }}
        run: |
          ARM_SUFFIX=""
          if [ -n "${{ matrix.goarm }}" ]; then ARM_SUFFIX="v${{ matrix.goarm }}"; fi
          go build -o ../dist/rpt-client-${{ matrix.goos }}-${{ matrix.goarch }}${ARM_SUFFIX}${{ matrix.suffix }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-client-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/rpt-client-*

  # ============== Wails Desktop (Windows) ==============
  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Desktop (Windows)
        working-directory: rpt-desktop-go
        run: wails build -clean -s -o rpt-desktop.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: rpt-desktop-go/build/bin/rpt-desktop.exe

  # ============== Wails Desktop (Linux) ==============
  build-desktop-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Wails dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Desktop (Linux)
        working-directory: rpt-desktop-go
        run: wails build -clean -s -o rpt-desktop

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: rpt-desktop-go/build/bin/rpt-desktop

  # ============== Wails Desktop (macOS) ==============
  build-desktop-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: darwin/amd64
          - arch: arm64
            platform: darwin/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Desktop (macOS ${{ matrix.arch }})
        working-directory: rpt-desktop-go
        run: wails build -clean -s -platform ${{ matrix.platform }}

      - name: Package as zip
        working-directory: rpt-desktop-go/build/bin
        run: zip -r ../../../rpt-desktop-macos-${{ matrix.arch }}.zip *.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: rpt-desktop-macos-${{ matrix.arch }}.zip

  # ============== Create Release ==============
  release:
    needs:
      - build-java
      - build-go-client
      - build-desktop-windows
      - build-desktop-linux
      - build-desktop-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Organize release files
        run: |
          mkdir -p release
          VERSION=${{ github.event.inputs.version }}

          # Java JARs
          cp artifacts/java-artifacts/rpt-server/target/rpt-server-*.jar release/rpt-server-${VERSION}.jar
          cp artifacts/java-artifacts/rpt-client/target/rpt-client-*.jar release/rpt-client-${VERSION}.jar

          # Go CLI
          for f in artifacts/go-client-*/*; do
            name=$(basename "$f")
            cp "$f" "release/${name}"
          done

          # Desktop
          cp artifacts/desktop-windows/* release/rpt-desktop-${VERSION}-windows.exe
          cp artifacts/desktop-linux/* release/rpt-desktop-${VERSION}-linux
          cp artifacts/desktop-macos-amd64/* release/rpt-desktop-${VERSION}-macos-amd64.zip
          cp artifacts/desktop-macos-arm64/* release/rpt-desktop-${VERSION}-macos-arm64.zip

          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          files: release/*
          generate_release_notes: true
          draft: false
