serverIp: 127.0.0.1
serverPort: 6167
clientCaPath: ca.crt
clientCertPath: client.crt
clientKeyPath: pkcs8_client.key
clientKey: b0cc39c7-1b78-4ff6-9486-020399f569e9
tunnelCount: 4
# 通道级背压水位线（字节）：积压达highWater向对端发TYPE_PAUSE，回落到lowWater发TYPE_RESUME
# capacity为告警线，超过只告警不丢数据；bufferLimit为绝对上限（默认0=capacity×8），超过说明对端未遵守背压，以RST放弃该通道
highWater: 262144
lowWater: 65536
capacity: 4194304
config:
  - proxyType: TCP
    localIp: 127.0.0.1
    localPort: 3389
    remotePort: 4389
    description: rdp
  - proxyType: UDP
    localIp: 127.0.0.1
    localPort: 3389
    remotePort: 4389
    description: rdp
  - proxyType: TCP
    localIp: 127.0.0.1
    localPort: 6379
    remotePort: 7379
    description: redis
  - proxyType: HTTP
    localIp: 127.0.0.1
    localPort: 8080
    domain: localhost
    token: admin:admin
    description: tomcat
  - proxyType: SOCKS5
    remotePort: 5080
    token: admin:admin
    description: socks5
