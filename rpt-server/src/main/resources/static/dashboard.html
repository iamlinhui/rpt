    <title>RPT Dashboard</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; }

        :root {
            --primary: #e78630; --primary-light: #f5a623; --primary-dark: #c26a15;
            --accent: #faad14;
            --success: #52c41a; --danger: #ff4d4f;
            --t1: #1a1a2e; --t2: #555770; --t3: #8e90a6; --t4: #c0c1d0;
            --surface: #ffffff; --bg: #f4f2ef;
            --border: rgba(0,0,0,0.06); --border-h: rgba(0,0,0,0.12);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
            --r: 16px; --rl: 20px;
        }

        body {
            font-family: var(--font); color: var(--t1);
            min-height: 100vh;
            background: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(231,134,48,0.08) 0, transparent 50%),
                radial-gradient(at 100% 0%, rgba(245,166,35,0.06) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(231,134,48,0.05) 0, transparent 50%),
                radial-gradient(at 0% 100%, rgba(82,196,26,0.04) 0, transparent 50%);
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        header {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 40px; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 50;
        }
        .h-left { display: flex; align-items: center; gap: 14px; }
        .h-logo {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(231,134,48,0.3);
            transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
        }
        .h-logo:hover { transform: scale(1.08) rotate(-5deg); }
        .h-logo svg { width: 20px; height: 20px; }
        .h-title { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; color: var(--t1); }
        .h-right {
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; color: var(--t3); font-weight: 500;
        }
        .h-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(82,196,26,0.2);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 3px rgba(82,196,26,0.2); }
            50% { box-shadow: 0 0 0 6px rgba(82,196,26,0.05); }
        }
        .h-cd {
            font-variant-numeric: tabular-nums; font-weight: 700; color: var(--primary);
            min-width: 12px; text-align: center;
            font-size: 14px;
        }

        /* ── Layout ── */
        main { padding: 32px 40px 80px; max-width: 1600px; margin: 0 auto; width: 100%; }

        /* ── Stats Grid ── */
        .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-bottom: 20px; }
        .stat {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--rl);
            padding: 24px 28px;
            transition: all 0.35s cubic-bezier(.22,1,.36,1);
            overflow: hidden;
            cursor: default;
        }
        .stat::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            opacity: 0; transition: opacity 0.3s;
        }
        .stat:hover {
            border-color: var(--border-h);
            box-shadow: 0 20px 40px -12px rgba(231,134,48,0.15), 0 4px 12px -4px rgba(0,0,0,0.05);
            transform: translateY(-4px);
        }
        .stat:hover::before { opacity: 1; }
        .stat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .stat-icon {
            width: 44px; height: 44px; border-radius: 14px;
            background: linear-gradient(135deg, rgba(231,134,48,0.12), rgba(245,166,35,0.08));
            display: flex; align-items: center; justify-content: center;
            color: var(--primary); flex-shrink: 0;
            transition: all 0.3s;
        }
        .stat:hover .stat-icon {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            box-shadow: 0 8px 20px -4px rgba(231,134,48,0.4);
        }
        .stat-icon svg { display: block; transition: transform 0.3s; }
        .stat:hover .stat-icon svg { transform: scale(1.1); }
        .stat-label { font-size: 14px; color: var(--t3); font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .stat-val {
            font-size: 36px; font-weight: 800; letter-spacing: -1.5px; line-height: 1;
            color: var(--t1);
            font-variant-numeric: tabular-nums;
        }

        /* ── Section Panel ── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--rl);
            margin-bottom: 24px;
            overflow: hidden;
            transition: all 0.35s;
        }
        .panel:hover {
            box-shadow: 0 12px 32px -8px rgba(0,0,0,0.08);
            border-color: var(--border-h);
        }
        .panel-head {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
        }
        .panel-bar {
            width: 5px; height: 22px; border-radius: 6px;
            background: linear-gradient(180deg, var(--primary), var(--primary-light));
            flex-shrink: 0;
        }
        .panel-title { font-size: 16px; font-weight: 600; color: var(--t1); letter-spacing: -0.3px; }
        .panel-count {
            font-size: 12px; font-weight: 700; color: var(--primary);
            background: rgba(231,134,48,0.1); border-radius: 12px;
            padding: 4px 12px; margin-left: 8px;
        }
        .panel-body { overflow-x: auto; }

        /* ── Table ── */
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 14px 28px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.6px; color: var(--t3);
            background: rgba(0,0,0,0.02); border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        td {
            padding: 16px 28px; font-size: 13px; color: var(--t2);
            border-bottom: 1px solid rgba(0,0,0,0.04);
            transition: background 0.15s;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(231,134,48,0.03); }
        td.mono { font-family: var(--mono); font-size: 12px; letter-spacing: -0.3px; }
        td.bold { font-weight: 600; color: var(--t1); }

        /* ── Tags ── */
        .tag {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 8px;
            font-size: 11px; font-weight: 600;
            margin: 2px 3px; white-space: nowrap;
            transition: transform 0.2s;
        }
        .tag:hover { transform: scale(1.05); }
        .tag::before { content:""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
        .tag-tcp { background: rgba(231,134,48,0.1); color: var(--primary-dark); }
        .tag-udp { background: rgba(194,106,21,0.1); color: #9e5000; }
        .tag-http { background: rgba(82,196,26,0.1); color: #389e0d; }
        .tag-online { background: rgba(82,196,26,0.12); color: #389e0d; }
        .tag-offline { background: rgba(255,77,79,0.1); color: #cf1322; }

        /* ── Traffic ── */
        .traffic { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
        .t-up { color: #389e0d; font-weight: 600; }
        .t-dn { color: var(--primary); font-weight: 600; }

        /* ── Kick Button ── */
        .btn-kick {
            font-family: var(--font); font-size: 12px; font-weight: 600;
            color: var(--danger); background: transparent;
            border: 1.5px solid rgba(255,77,79,0.25); border-radius: 8px;
            padding: 6px 16px; cursor: pointer;
            transition: all 0.25s cubic-bezier(.22,1,.36,1);
        }
        .btn-kick:hover {
            background: var(--danger); color: #fff; border-color: var(--danger);
            box-shadow: 0 8px 20px -4px rgba(255,77,79,0.4);
            transform: translateY(-1px);
        }
        .btn-kick:active { transform: translateY(0); }

        /* ── Empty State ── */
        .empty {
            text-align: center; padding: 72px 20px; color: var(--t4); font-size: 14px;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .empty::before {
            content: ""; width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(231,134,48,0.08), rgba(245,166,35,0.04));
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px;
        }

        /* ── Responsive ── */
        @media (max-width: 1024px) {
            .stats { grid-template-columns: repeat(2, 1fr); gap: 16px; }
            main, header { padding-left: 24px; padding-right: 24px; }
            .stat { padding: 20px 22px; }
            .stat-val { font-size: 30px; }
            th, td { padding-left: 20px; padding-right: 20px; }
            .panel-head { padding: 18px 22px; }
        }

        @media (max-width: 640px) {
            .stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .stat { padding: 18px 20px; }
            .stat::before { height: 3px; }
            .stat-head { margin-bottom: 12px; gap: 10px; }
            .stat-icon { width: 36px; height: 36px; border-radius: 10px; }
            .stat-icon svg { width: 16px; height: 16px; }
            .stat-label { font-size: 12px; }
            .stat-val { font-size: 26px; letter-spacing: -1px; }
            main { padding: 20px 16px 60px; }
            header { padding: 0 16px; height: 56px; }
            .h-title { font-size: 15px; }
            .h-logo { width: 36px; height: 36px; border-radius: 10px; }
            .h-logo svg { width: 18px; height: 18px; }
            .panel { margin-bottom: 16px; }
            .panel-head { padding: 16px 20px; }
            .panel-title { font-size: 14px; }
            th, td { padding: 12px 16px; }
            th { font-size: 10px; padding: 10px 16px; }
            td { font-size: 12px; }
            .tag { font-size: 10px; padding: 3px 9px; }
        }

        @media (max-width: 380px) {
            .stats { grid-template-columns: 1fr; }
        }

        /* ── Animations ── */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stat, .panel { animation: fadeIn 0.5s ease-out backwards; }
        .stat:nth-child(1) { animation-delay: 0.05s; }
        .stat:nth-child(2) { animation-delay: 0.1s; }
        .stat:nth-child(3) { animation-delay: 0.15s; }
        .stat:nth-child(4) { animation-delay: 0.2s; }
        .panel:nth-child(1) { animation-delay: 0.25s; }
        .panel:nth-child(2) { animation-delay: 0.3s; }
    </style>
</head>
<body>

<header>
    <div class="h-left">
        <div class="h-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
        </div>
        <span class="h-title">RPT Dashboard</span>
    </div>
    <div class="h-right">
        <span class="h-dot"></span>
        <span>自动刷新</span>
        <span class="h-cd" id="countdown">5</span><span>s</span>
    </div>
</header>

<main>
    <div class="stats" id="statusCards"></div>
    <div class="stats" id="portCards" style="grid-template-columns: repeat(3,1fr); margin-bottom: 28px"></div>
    <div class="panel">
        <div class="panel-head">
            <div class="panel-bar"></div>
            <span class="panel-title">在线客户端</span>
            <span class="panel-count" id="clientCount">0</span>
        </div>
        <div class="panel-body" id="clientsTable"></div>
    </div>
    <div class="panel">
        <div class="panel-head">
            <div class="panel-bar"></div>
            <span class="panel-title">HTTP 域名绑定</span>
            <span class="panel-count" id="domainCount">0</span>
        </div>
        <div class="panel-body" id="domainsTable"></div>
    </div>
</main>

<script>
    const I = {
        clock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
        users:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>',
        link:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>',
        bars:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
        server:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><circle cx="6" cy="6" r="1"/><circle cx="6" cy="18" r="1"/></svg>',
        globe:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>',
        lock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
        monitor:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>'
    };

    let countdown = 5;
    const $ = id => document.getElementById(id);
    const cache = { clients: '', domains: '' };

    function card(label, value, icon) {
        return `<div class="stat"><div class="stat-head"><div class="stat-icon">${icon}</div><span class="stat-label">${label}</span></div><div class="stat-val">${value}</div></div>`;
    }

    function tag(cls, text) {
        return `<span class="tag ${cls}">${text}</span>`;
    }

    function renderStatus(d) {
        const statusEl = $('statusCards');
        const portEl = $('portCards');

        // 首次渲染：创建完整结构
        if (!statusEl.dataset.ready) {
            statusEl.innerHTML = [
                card('运行时间', d.uptimeText, I.clock),
                card('在线客户端', d.onlineClients, I.users),
                card('代理连接', d.proxyChannels, I.link),
                card('历史连接', d.totalConnections, I.bars)
            ].join('');
            statusEl.dataset.ready = '1';
        } else {
            // 后续只更新数值
            const vals = statusEl.querySelectorAll('.stat-val');
            const newVals = [d.uptimeText, d.onlineClients, d.proxyChannels, d.totalConnections];
            vals.forEach((el, i) => { if (el.textContent != newVals[i]) el.textContent = newVals[i]; });
        }

        if (!portEl.dataset.ready) {
            portEl.innerHTML = [
                card('服务端口', d.serverPort, I.server),
                card('HTTP 端口', d.httpPort || '—', I.globe),
                card('Dashboard', d.dashboardPort || '—', I.monitor)
            ].join('');
            portEl.dataset.ready = '1';
        } else {
            const vals = portEl.querySelectorAll('.stat-val');
            const newVals = [d.serverPort, d.httpPort || '—', d.dashboardPort || '—'];
            vals.forEach((el, i) => { if (el.textContent != newVals[i]) el.textContent = newVals[i]; });
        }
    }

    function renderClients(data) {
        $('clientCount').textContent = data.length;
        const el = $('clientsTable');
        if (!data.length) {
            const emptyHtml = '<div class="empty">暂无在线客户端</div>';
            if (cache.clients !== emptyHtml) { el.innerHTML = emptyHtml; cache.clients = emptyHtml; }
            return;
        }
        let h = '<table><thead><tr><th>ClientKey</th><th>远程地址</th><th>连接时间</th><th>代理端口</th><th>连接</th><th>会话</th><th>流量</th><th>流速</th><th></th></tr></thead><tbody>';
        data.forEach(c => {
            const key = c.clientKey.length > 14 ? c.clientKey.substring(0,14)+'…' : c.clientKey;
            let ports = '';
            (c.tcpPorts||[]).forEach(p => ports += tag('tag-tcp','TCP:'+p));
            (c.udpPorts||[]).forEach(p => ports += tag('tag-udp','UDP:'+p));
            (c.domains||[]).forEach(d => ports += tag('tag-http',d));
            h += `<tr>
                <td data-label="Key" class="mono" title="${c.clientKey}">${key}</td>
                <td data-label="地址">${c.remoteAddress}</td>
                <td data-label="时间" style="white-space:nowrap">${c.connectTime}</td>
                <td data-label="端口">${ports||'—'}</td>
                <td data-label="连接" class="bold">${c.proxyChannels}</td>
                <td data-label="会话">${c.activeSessions}</td>
                <td data-label="流量"><span class="traffic"><span class="t-up">↑${c.bytesInText}</span> <span class="t-dn">↓${c.bytesOutText}</span></span></td>
                <td data-label="流速"><span class="traffic"><span class="t-up">↑${c.speedInText}</span> <span class="t-dn">↓${c.speedOutText}</span></span></td>
                <td><button class="btn-kick" onclick="kick('${c.channelId}')">断开</button></td>
            </tr>`;
        });
        h += '</tbody></table>';
        if (cache.clients !== h) { el.innerHTML = h; cache.clients = h; }
    }

    function renderDomains(data) {
        $('domainCount').textContent = data.length;
        const el = $('domainsTable');
        if (!data.length) {
            const emptyHtml = '<div class="empty">暂无域名绑定</div>';
            if (cache.domains !== emptyHtml) { el.innerHTML = emptyHtml; cache.domains = emptyHtml; }
            return;
        }
        let h = '<table><thead><tr><th>域名</th><th>ClientKey</th><th>状态</th><th>Token</th></tr></thead><tbody>';
        data.forEach(d => {
            const st = d.online ? tag('tag-online','在线') : tag('tag-offline','离线');
            const k = d.clientKey && d.clientKey.length > 14 ? d.clientKey.substring(0,14)+'…' : (d.clientKey||'—');
            h += `<tr><td class="bold">${d.domain}</td><td class="mono">${k}</td><td>${st}</td><td>${d.token?'已配置':'—'}</td></tr>`;
        });
        h += '</tbody></table>';
        if (cache.domains !== h) { el.innerHTML = h; cache.domains = h; }
    }

    async function kick(id) {
        if (!confirm('确定断开此客户端？')) return;
        await fetch('/api/clients/'+id,{method:'DELETE'});
        refresh();
    }

    async function refresh() {
        try {
            const [s,c,d] = await Promise.all([
                fetch('/api/status').then(r=>r.json()),
                fetch('/api/clients').then(r=>r.json()),
                fetch('/api/domains').then(r=>r.json())
            ]);
            renderStatus(s); renderClients(c); renderDomains(d);
        } catch(e) { console.error(e); }
        countdown = 5;
    }

    refresh();
    setInterval(()=>{
        countdown--;
        $('countdown').textContent = countdown;
        if(countdown<=0) refresh();
    },1000);
</script>
</body>
</html>
