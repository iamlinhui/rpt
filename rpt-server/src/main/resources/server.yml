serverIp: 0.0.0.0
serverPort: 6167
httpPort: 6234
serverCaPath: ca.crt
serverCertPath: server.crt
serverKeyPath: pkcs8_server.key
# 限制连接暴露端口的IP必须属于这些国家(ISO码,逗号分隔,如 CN,HK)。留空 = 关闭国家过滤(放行所有)
ipFilterCountry: CN,HK
dashboardPort: 7476
dashboardUser: admin
dashboardPassword: admin
# 通道级背压水位线（字节）：积压达highWater向对端发TYPE_PAUSE，回落到lowWater发TYPE_RESUME
# capacity为告警线，超过只告警不丢数据；bufferLimit为绝对上限（默认0=capacity×8），超过说明对端未遵守背压，以RST放弃该通道
highWater: 262144
lowWater: 65536
capacity: 4194304
# UDP虚拟会话空闲超时（秒，默认300）：上下行都无数据报超过该值才回收。回收后客户端会换本地源端口，RDP-UDP等面向连接的协议会断流，不宜低于70
udpSessionTimeout: 300
token:
  - clientKey: b0cc39c7-1b78-4ff6-9486-020399f569e9
    minPort: 4000
    maxPort: 8000
  - clientKey: 4befea7e-a61c-4979-b012-47659bab6f21
    minPort: 9000
    maxPort: 9999
