<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Reverse Proxy Tool</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f3f4f7;--surface-3:#ebedf1;
  --border:#e7e9ee;--border-2:#d7dbe2;
  --text:#1d2433;--text-2:#5a6573;--text-3:#9aa3b2;
  --primary:#4f7cff;--primary-h:#6a93ff;--primary-soft:rgba(79,124,255,.12);
  --success:#22c55e;--success-soft:rgba(34,197,94,.12);
  --danger:#ef4444;--danger-soft:rgba(239,68,68,.10);
  --warning:#f59e0b;
  --tag-tcp-bg:#e8f1ff;--tag-tcp-fg:#2563eb;
  --tag-udp-bg:#fff3e6;--tag-udp-fg:#ea8a0f;
  --tag-http-bg:#e9f9ee;--tag-http-fg:#16a34a;
  --tag-socks5-bg:#f1e9ff;--tag-socks5-fg:#7c3aed;
  --log-bg:#11131a;--log-fg:#c9d1d9;--log-border:rgba(255,255,255,.06);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow:0 4px 16px rgba(16,24,40,.08);
  --shadow-lg:0 12px 40px rgba(16,24,40,.16);
  --r-sm:6px;--r:10px;--r-lg:14px;
}
body[data-theme="dark"]{
  --bg:#0e1116;--surface:#171b22;--surface-2:#1e232c;--surface-3:#262c37;
  --border:#262c37;--border-2:#323947;
  --text:#e6e8eb;--text-2:#9aa3b2;--text-3:#6b7280;
  --primary:#5b85ff;--primary-h:#7c9fff;--primary-soft:rgba(91,133,255,.18);
  --success:#3bdc6e;--success-soft:rgba(59,220,110,.14);
  --danger:#f56c6c;--danger-soft:rgba(245,108,108,.14);
  --tag-tcp-bg:rgba(37,99,233,.18);--tag-tcp-fg:#7aa8ff;
  --tag-udp-bg:rgba(234,138,15,.18);--tag-udp-fg:#fbb365;
  --tag-http-bg:rgba(22,163,74,.18);--tag-http-fg:#5fd684;
  --tag-socks5-bg:rgba(124,58,237,.20);--tag-socks5-fg:#b58dff;
  --log-bg:#0a0c11;--log-border:rgba(255,255,255,.05);
}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC","-apple-system","Segoe UI","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
::-webkit-scrollbar-track{background:transparent}

/* ==================== Topbar ==================== */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:var(--shadow-sm)}
.topbar .spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;outline:none;line-height:1}
.btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.btn:active{transform:scale(.97)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-p{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-p:hover{background:var(--primary-h);border-color:var(--primary-h);color:#fff}
.btn-d{color:var(--danger);border-color:var(--danger)}.btn-d:hover{background:var(--danger);color:#fff}
.btn-s{color:var(--success);border-color:var(--success)}.btn-s:hover{background:var(--success);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:7px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;color:var(--text-2);transition:all .15s;display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft)}
.btn-icon svg{width:16px;height:16px}
.btn-segmented{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow-sm)}
.btn-segment{padding:7px 14px;border:none;background:transparent;color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;position:relative}
.btn-segment:not(:last-child)::after{content:'';position:absolute;right:0;top:20%;height:60%;width:1px;background:var(--border)}
.btn-segment:hover{background:var(--surface-3);color:var(--text)}
.btn-segment svg{width:14px;height:14px;flex-shrink:0}
.btn-segment.running{color:var(--danger)}
.btn-segment.running svg{color:var(--danger)}

/* status pill */
.status-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;color:var(--text-2);transition:all .2s}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);position:relative}
.status-pill.on{background:var(--success-soft);border-color:rgba(34,197,94,.35);color:var(--success)}
.status-pill.on .dot{background:var(--success)}
.status-pill.on .dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--success);opacity:.35;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.35}70%{transform:scale(2.2);opacity:0}100%{opacity:0}}
.status-pill .srv{color:var(--text-3);font-variant-numeric:tabular-nums}

/* ==================== Content ==================== */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;padding:14px}
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.proxy-section{flex:1;min-height:0}
.section-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.section-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title svg{width:16px;height:16px;color:var(--primary)}
.count-badge{font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface-3);padding:1px 8px;border-radius:999px}
.search-box{position:relative;margin-left:auto;width:200px}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--text-3)}
.search-box input{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text);font-size:12.5px;outline:none;transition:all .15s}
.search-box input:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft)}
.search-box input::placeholder{color:var(--text-3)}

/* table */
.table-wrap{flex:1;overflow:auto;min-height:0}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:2}
thead th{background:var(--surface-2);padding:9px 14px;text-align:left;font-weight:600;border-bottom:1px solid var(--border);color:var(--text-2);font-size:11.5px;letter-spacing:.4px;text-transform:uppercase}
thead th:last-child{text-align:right}
tbody tr{transition:background .12s;cursor:default}
tbody tr:hover{background:var(--primary-soft)}
tbody tr.sel{background:var(--primary-soft)}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:"Cascadia Code","SF Mono","Consolas",monospace;font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.tag-tcp{background:var(--tag-tcp-bg);color:var(--tag-tcp-fg)}
.tag-udp{background:var(--tag-udp-bg);color:var(--tag-udp-fg)}
.tag-http{background:var(--tag-http-bg);color:var(--tag-http-fg)}
.tag-socks5{background:var(--tag-socks5-bg);color:var(--tag-socks5-fg)}
.remote-cell{display:flex;align-items:center;gap:6px}
.copy-btn{border:none;background:transparent;color:var(--text-3);cursor:pointer;padding:3px;border-radius:4px;display:inline-flex;transition:all .12s;opacity:0}
tr:hover .copy-btn,.copy-btn:focus{opacity:1}
.copy-btn:hover{color:var(--primary);background:var(--primary-soft)}
.copy-btn svg{width:14px;height:14px}
.row-actions{display:flex;justify-content:flex-end;gap:4px;opacity:0;transition:opacity .12s}
tr:hover .row-actions{opacity:1}
.act-btn{border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer;padding:5px;border-radius:5px;display:inline-flex;transition:all .12s}
.act-btn:hover{color:var(--primary);background:var(--primary-soft);border-color:var(--border)}
.act-btn.del:hover{color:var(--danger);background:var(--danger-soft);border-color:rgba(239,68,68,.25)}
.act-btn svg{width:15px;height:15px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:48px 20px;color:var(--text-3);text-align:center}
.empty-state svg{width:46px;height:46px;margin-bottom:12px;opacity:.5}
.empty-state p{font-size:13.5px;margin-bottom:14px}

/* ==================== Log ==================== */
.log-section{flex-shrink:0;margin-top:12px;transition:flex .2s}
.log-section.collapsed{flex:0 0 auto}
.log-section.collapsed .log-content{display:none}
.log-head{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.log-head .section-title{font-size:12.5px}
.log-head .section-title svg{color:var(--text-2)}
.log-tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.log-search{position:relative;width:180px}
.log-search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--text-3)}
.log-search input{width:100%;padding:5px 8px 5px 26px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text);font-size:12px;outline:none;transition:all .15s}
.log-search input:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);cursor:pointer;user-select:none;padding:4px 8px;border-radius:var(--r-sm);transition:all .12s}
.toggle:hover{background:var(--surface-3)}
.toggle input{margin:0;cursor:pointer}
.log-content{flex-shrink:0;overflow-y:auto;background:var(--log-bg);color:var(--log-fg);font-family:"Cascadia Code","SF Mono","Consolas",monospace;font-size:12px;line-height:1.7;height:160px}
.log-section.collapsed .log-content{height:0}
.log-line{padding:0 14px;border-bottom:1px solid var(--log-border);white-space:pre-wrap;word-break:break-all}
.log-line:hover{background:rgba(255,255,255,.04)}
.log-line .hl{background:rgba(245,158,11,.35);border-radius:2px;padding:0 1px;color:#fff}
.log-empty{padding:30px;text-align:center;color:var(--text-3)}

/* ==================== Context Menu ==================== */
.ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:5px;z-index:9999;min-width:130px;display:none;animation:ctxIn .1s}
@keyframes ctxIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ctx-item{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:13px;cursor:pointer;border-radius:var(--r-sm);transition:background .12s;color:var(--text)}
.ctx-item svg{width:15px;height:15px;color:var(--text-2)}
.ctx-item:hover{background:var(--primary-soft);color:var(--primary)}
.ctx-item.danger{color:var(--danger)}
.ctx-item.danger svg{color:var(--danger)}
.ctx-item.danger:hover{background:var(--danger-soft)}

/* ==================== Modal ==================== */
.modal-mask{position:fixed;inset:0;background:rgba(16,24,40,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:5000;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:480px;max-width:92vw;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;animation:modalIn .2s cubic-bezier(.2,.9,.3,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(-16px) scale(.98)}to{opacity:1;transform:none}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-hd .title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
.modal-hd .title svg{width:18px;height:18px;color:var(--primary)}
.modal-close{border:none;background:transparent;color:var(--text-3);cursor:pointer;padding:4px;border-radius:6px;display:inline-flex;transition:all .12s}
.modal-close:hover{color:var(--danger);background:var(--danger-soft)}
.modal-close svg{width:18px;height:18px}
.modal-bd{padding:20px;overflow-y:auto}
.modal-ft{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--surface-2)}

.form-row{display:flex;align-items:center;margin-bottom:14px}
.form-row:last-child{margin-bottom:0}
.form-lb{width:78px;font-size:13px;color:var(--text-2);flex-shrink:0;display:flex;align-items:center;gap:2px}
.form-in{flex:1;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface-2);color:var(--text);font-size:13px;outline:none;transition:all .15s;font-family:inherit}
.form-in:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-soft)}
select.form-in{background:var(--surface-2);cursor:pointer}
.form-req{color:var(--danger);margin-left:2px}
.form-hint{font-size:11.5px;color:var(--text-3);margin-top:4px;margin-left:78px;line-height:1.4}
.file-row{display:flex;gap:6px;flex:1}
.file-row .form-in{flex:1}
.form-err{color:var(--danger);font-size:12.5px;padding:8px 12px;margin:-4px 0 0;background:var(--danger-soft);border-radius:var(--r-sm);text-align:center;display:none}
.form-err.show{display:block;animation:fadeIn .15s}

/* ==================== Toast ==================== */
.toast-wrap{position:fixed;top:14px;right:14px;z-index:9000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);font-size:13px;color:var(--text);animation:toastIn .22s cubic-bezier(.2,.9,.3,1);pointer-events:auto;max-width:320px}
.toast.out{animation:toastOut .2s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(16px)}}
.toast svg{width:17px;height:17px;flex-shrink:0}
.toast.ok svg{color:var(--success)}
.toast.err svg{color:var(--danger)}
.toast.info svg{color:var(--primary)}
</style>
</head>
<body data-theme="light">

<header class="topbar">
  <div class="btn-segmented">
    <button class="btn-segment" onclick="showServerDialog()" title="连接配置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      服务器
    </button>
    <button class="btn-segment" onclick="showAddDialog()" title="新增映射">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
      新增
    </button>
    <button class="btn-segment" id="startBtn" onclick="toggleConn()" title="开启/关闭">
      <svg id="startIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <span id="startLabel">开启</span>
    </button>
  </div>
  <div class="spacer"></div>
  <button class="btn-icon" id="themeBtn" onclick="toggleTheme()" title="切换主题"></button>
  <button class="btn-icon" onclick="showAbout()" title="关于">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  </button>
  <div class="status-pill" id="statusPill">
    <span class="dot"></span>
    <span id="statusText">已停止</span>
  </div>
</header>

<div class="content">
  <section class="section proxy-section">
    <div class="section-head">
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
        映射配置
      </div>
      <span class="count-badge" id="countBadge">0</span>
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="proxySearch" placeholder="筛选 类型/地址/备注…" oninput="render()">
      </div>
    </div>
    <div class="table-wrap">
      <table><thead><tr>
        <th style="width:9%">类型</th>
        <th style="width:22%">本地映射</th>
        <th style="width:28%">暴露映射</th>
        <th>备注</th>
        <th style="width:80px">操作</th>
      </tr></thead><tbody id="tbody"></tbody></table>
    </div>
  </section>

  <section class="section log-section" id="logSection">
    <div class="log-head">
      <div class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
        日志输出
      </div>
      <span class="count-badge" id="logCount">0</span>
      <div class="log-tools">
        <div class="log-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="logSearch" placeholder="过滤日志…" oninput="renderLog()">
        </div>
        <label class="toggle" title="自动滚动到底部">
          <input type="checkbox" id="autoScroll" checked onchange="onAutoScrollChange()"> 自动滚动
        </label>
        <button class="btn-icon" onclick="clearLogs()" title="清空日志">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        </button>
        <button class="btn-icon" onclick="toggleLog()" title="折叠/展开">
          <svg id="logToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>
    <div class="log-content" id="logArea" oncontextmenu="showLogCtx(event)"></div>
  </section>
</div>

<div class="ctx-menu" id="tableCtx">
  <div class="ctx-item" onclick="editCtx()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>
    编辑
  </div>
  <div class="ctx-item danger" onclick="deleteCtx()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
    删除
  </div>
</div>
<div class="ctx-menu" id="logCtx">
  <div class="ctx-item" onclick="clearLogs()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
    清空日志
  </div>
</div>

<div id="mc"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
const go = window.go.main.App;
let cfg = [], started = false, ctxIdx = -1, _srvInfo = null, modalOkHandler = null;

// ==================== Icons ====================
const ICO = {
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>',
  del:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12l8.73-5.04M12 22V12"/></svg>',
  ok:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>',
  err:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  sun:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  play: '<path d="M8 5v14l11-7z"/>',
};

// ==================== Theme ====================
function applyTheme(t){ document.body.setAttribute('data-theme', t); document.getElementById('themeBtn').innerHTML = t==='dark'?ICO.moon:ICO.sun; try { go.SetWindowTheme(t==='dark'); } catch(e){} }
function toggleTheme(){ const t = document.body.getAttribute('data-theme')==='dark'?'light':'dark'; localStorage.setItem('rpt-theme', t); applyTheme(t); }
applyTheme(localStorage.getItem('rpt-theme') || 'light');

// ==================== Init ====================
async function init() {
  const c = await go.GetConfig();
  cfg = c.config || [];
  render();
  startLogPolling();
}

// ==================== Toast ====================
function toast(msg, type='info', ms=2200) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (ICO[type] || ICO.info) + '<span>' + msg + '</span>';
  wrap.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, ms);
}

// ==================== Logs ====================
const MAX_LOG_LINES = 500;
let logLines = [];
let logFilter = '';
let polling = false;
let logTimer = null;
let pageVisible = true;
let pendingScroll = false;

document.addEventListener('visibilitychange', () => {
  pageVisible = !document.hidden;
  if (pageVisible && pendingScroll) { scrollLog(); pendingScroll = false; }
});

function startLogPolling() {
  if (logTimer) return;
  logTimer = setInterval(pollLogs, pageVisible ? 400 : 2000);
}
function adjustPollingRate() { clearInterval(logTimer); logTimer = null; startLogPolling(); }
document.addEventListener('visibilitychange', adjustPollingRate);

async function pollLogs() {
  if (polling) return;
  polling = true;
  try {
    const s = await go.GetLogs();
    if (!s) return;
    const lines = s.split('\n').filter(l => l);
    if (!lines.length) return;
    logLines.push(...lines);
    while (logLines.length > MAX_LOG_LINES) logLines.shift();
    renderLog();
  } finally { polling = false; }
}

function renderLog() {
  const el = document.getElementById('logArea');
  logFilter = document.getElementById('logSearch').value.trim().toLowerCase();
  document.getElementById('logCount').textContent = logLines.length;
  if (!logLines.length) { el.innerHTML = '<div class="log-empty">暂无日志</div>'; return; }
  const frag = document.createDocumentFragment();
  const list = logFilter ? logLines.filter(l => l.toLowerCase().includes(logFilter)) : logLines;
  list.forEach(l => {
    const div = document.createElement('div');
    div.className = 'log-line';
    if (logFilter) {
      const idx = l.toLowerCase().indexOf(logFilter);
      div.innerHTML = escapeHtml(l.slice(0, idx)) + '<span class="hl">' + escapeHtml(l.slice(idx, idx+logFilter.length)) + '</span>' + escapeHtml(l.slice(idx+logFilter.length));
    } else {
      div.textContent = l;
    }
    frag.appendChild(div);
  });
  el.innerHTML = '';
  el.appendChild(frag);
  if (document.getElementById('autoScroll').checked) scrollLog();
}
function scrollLog() { const el = document.getElementById('logArea'); el.scrollTop = el.scrollHeight; }
function onAutoScrollChange() { if (document.getElementById('autoScroll').checked) scrollLog(); }
function clearLogs() { logLines = []; renderLog(); hideCtx(); toast('日志已清空', 'info'); }

function showLogCtx(e) {
  e.preventDefault();
  const m = document.getElementById('logCtx');
  m.style.display = 'block';
  positionCtx(m, e.clientX, e.clientY);
}
function toggleLog() {
  const s = document.getElementById('logSection');
  s.classList.toggle('collapsed');
  const icon = document.getElementById('logToggleIcon');
  icon.innerHTML = s.classList.contains('collapsed') ? '<path d="M6 15l6-6 6 6"/>' : '<path d="M6 9l6 6 6-6"/>';
}

// ==================== Table ====================
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const TABLE_HTML = '<table><thead><tr><th style="width:9%">类型</th><th style="width:22%">本地映射</th><th style="width:28%">暴露映射</th><th>备注</th><th style="width:80px">操作</th></tr></thead><tbody id="tbody"></tbody></table>';

function render() {
  document.getElementById('countBadge').textContent = cfg.length;
  const wrap = document.querySelector('.table-wrap');
  const q = document.getElementById('proxySearch').value.trim().toLowerCase();

  // Empty: replace table with full-area empty state
  if (!cfg.length) {
    wrap.innerHTML = '<div class="empty-state">' + ICO.empty + '<p>暂无映射配置</p><button class="btn btn-p" onclick="showAddDialog()">＋ 新增第一条配置</button></div>';
    return;
  }

  // Restore table if it was removed
  if (!wrap.querySelector('table')) {
    wrap.innerHTML = TABLE_HTML;
  }

  const rows = cfg.map((r,i)=>({r,i})).filter(({r}) => {
    if (!q) return true;
    const local = r.proxyType === 'SOCKS5' ? '动态' : (r.localIp||'127.0.0.1')+':'+(r.localPort||0);
    const remote = r.proxyType === 'HTTP' ? (r.domain||'') : ':'+(r.remotePort||0);
    return (r.proxyType+' '+local+' '+remote+' '+(r.description||'')+' '+(r.token||'')).toLowerCase().includes(q);
  });

  const tb = document.getElementById('tbody');
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="5"><div class="empty-state" style="padding:24px"><p>没有匹配的配置</p></div></td></tr>'; return; }
  tb.innerHTML = rows.map(({r,i}) => {
    const tagCls = 'tag-' + (r.proxyType||'tcp').toLowerCase();
    const local = r.proxyType === 'SOCKS5' ? '<span class="muted">动态目标</span>' : '<span class="mono">'+escapeHtml(r.localIp||'127.0.0.1')+':'+escapeHtml(r.localPort||0)+'</span>';
    let remote, copyTarget='';
    if (r.proxyType === 'HTTP') {
      remote = '<span class="mono">'+escapeHtml(r.domain||'')+'</span>' + (r.token ? ' <span class="muted">'+escapeHtml(r.token)+'</span>' : '');
      copyTarget = r.domain||'';
    } else {
      remote = '<span class="mono">:'+escapeHtml(r.remotePort||0)+'</span>' + (r.proxyType === 'SOCKS5' && r.token ? ' <span class="muted">'+escapeHtml(r.token)+'</span>' : '');
      copyTarget = ':'+(r.remotePort||0);
    }
    return `<tr class="${i===ctxIdx?'sel':''}" oncontextmenu="showTableCtx(event,${i})" onclick="selectRow(${i})">
      <td><span class="tag ${tagCls}">${r.proxyType}</span></td>
      <td>${local}</td>
      <td><div class="remote-cell">${remote}${copyTarget?`<button class="copy-btn" title="复制" onclick="event.stopPropagation();copyText('${escapeHtml(copyTarget)}')">${ICO.copy}</button>`:''}</div></td>
      <td>${r.description?escapeHtml(r.description):'<span class="muted">—</span>'}</td>
      <td><div class="row-actions">
        <button class="act-btn" title="编辑" onclick="event.stopPropagation();showEditDialog(${i})">${ICO.edit}</button>
        <button class="act-btn del" title="删除" onclick="event.stopPropagation();deleteRow(${i})">${ICO.del}</button>
      </div></td></tr>`;
  }).join('');
}

function selectRow(i){ ctxIdx = (ctxIdx===i?-1:i); render(); }

function showTableCtx(e, i) {
  e.preventDefault();
  if (started) { showTip('请先关闭连接'); return; }
  ctxIdx = i; render();
  const m = document.getElementById('tableCtx');
  m.style.display = 'block';
  positionCtx(m, e.clientX, e.clientY);
}
function positionCtx(m, x, y) {
  m.style.left = Math.min(x, window.innerWidth - m.offsetWidth - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - m.offsetHeight - 8) + 'px';
}
function editCtx() { hideCtx(); if (ctxIdx >= 0) showEditDialog(ctxIdx); }
async function deleteCtx() { hideCtx(); if (ctxIdx >= 0) deleteRow(ctxIdx); }
async function deleteRow(i) {
  const r = cfg[i];
  const localDesc = r.proxyType === 'SOCKS5' ? ':'+(r.remotePort||0) : (r.localIp||'127.0.0.1')+':'+(r.localPort||0);
  showConfirm('删除确认', `确定删除 <b>[${escapeHtml(r.proxyType)}]</b> ${escapeHtml(localDesc)} ？`, async () => {
    await go.DeleteProxyConfig(i);
    cfg.splice(i, 1);
    ctxIdx = -1; render();
    toast('配置已删除', 'ok');
  });
}

document.addEventListener('click', hideCtx);
function hideCtx() { document.querySelectorAll('.ctx-menu').forEach(m => m.style.display = 'none'); }

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('已复制 ' + t, 'ok', 1400); }
  catch(e) { toast('复制失败', 'err'); }
}

// ==================== Connection ====================
async function toggleConn() {
  const btn = document.getElementById('startBtn');
  const pill = document.getElementById('statusPill');
  const txt = document.getElementById('statusText');
  if (started) {
    await go.Stop();
    started = false;
    document.getElementById('startIcon').innerHTML = ICO.play;
    document.getElementById('startLabel').textContent = '开启';
    btn.classList.remove('running');
    pill.className = 'status-pill';
    txt.textContent = '已停止';
    pill.querySelector('.srv')?.remove();
  } else {
    const err = await go.Start();
    if (err) { showTip(err); return; }
    started = true;
    document.getElementById('startIcon').innerHTML = ICO.stop;
    document.getElementById('startLabel').textContent = '关闭';
    btn.classList.add('running');
    pill.className = 'status-pill on';
    txt.textContent = '运行中';
    await refreshSrvInfo();
    if (_srvInfo) {
      const s = document.createElement('span');
      s.className = 'srv';
      s.textContent = _srvInfo;
      pill.appendChild(s);
    }
  }
}
async function refreshSrvInfo() { try { const c = await go.GetConfig(); _srvInfo = c.serverIp + ':' + c.serverPort; } catch(e){} }

// ==================== Modal ====================
function showModal(title, body, onOk, hideCancel, icon) {
  document.getElementById('mc').innerHTML = `<div class="modal-mask">
    <div class="modal">
      <div class="modal-hd"><div class="title">${icon||''}${title}</div>
        <button class="modal-close" onclick="closeModal()">${ICO.close}</button></div>
      <div class="modal-bd">${body}<div class="form-err" id="formErrMsg"></div></div>
      <div class="modal-ft">${hideCancel?'':'<button class="btn" onclick="closeModal()">取消</button>'}
        <button class="btn btn-p" id="mOk">确定</button></div></div></div>`;
  modalOkHandler = onOk || closeModal;
  document.getElementById('mOk').onclick = () => modalOkHandler && modalOkHandler();
}
function closeModal() { document.getElementById('mc').innerHTML = ''; modalOkHandler = null; }
document.addEventListener('keydown', e => {
  if (!document.getElementById('mc').innerHTML) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.classList.contains('form-in')) {
    const ok = document.getElementById('mOk');
    if (ok) { e.preventDefault(); ok.click(); }
  }
});

function showTip(msg) {
  showModal('提示', `<p style="text-align:center;padding:14px 0;font-size:14px;line-height:1.6">${msg}</p>`, closeModal, true, ICO.info);
}
function showConfirm(title, msg, onOk) {
  showModal(title, `<p style="padding:10px 0;font-size:14px;line-height:1.6">${msg}</p>`, () => { closeModal(); onOk(); }, false, ICO.info);
}
function showFormErr(msg) {
  const el = document.getElementById('formErrMsg');
  if (el) { el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3000); }
}

// ==================== Proxy Config Dialog ====================
function proxyForm(r) {
  const h = r.proxyType === 'HTTP';
  const s = r.proxyType === 'SOCKS5';
  const hideLocal = s;
  const req = '<span class="form-req">*</span>';
  return `<div class="form-row"><span class="form-lb">传输类型${req}</span>
    <select class="form-in" id="f_pt" onchange="tpf()">
      <option value="TCP" ${r.proxyType==='TCP'?'selected':''}>TCP</option>
      <option value="UDP" ${r.proxyType==='UDP'?'selected':''}>UDP</option>
      <option value="HTTP" ${r.proxyType==='HTTP'?'selected':''}>HTTP</option>
      <option value="SOCKS5" ${r.proxyType==='SOCKS5'?'selected':''}>SOCKS5</option></select></div>
  <div class="form-row" id="lir" style="display:${hideLocal?'none':'flex'}"><span class="form-lb">本地地址${hideLocal?'':req}</span><input class="form-in" id="f_ip" value="${escapeHtml(r.localIp||'127.0.0.1')}" placeholder="127.0.0.1"></div>
  <div class="form-row" id="lpr" style="display:${hideLocal?'none':'flex'}"><span class="form-lb">本地端口${req}</span><input class="form-in" id="f_lp" type="number" value="${r.localPort||''}" placeholder="1-65535"></div>
  <div class="form-row" id="rpr" style="display:${h?'none':'flex'}"><span class="form-lb">暴露端口${req}</span><input class="form-in" id="f_rp" type="number" value="${r.remotePort||''}" placeholder="1024-65535"></div>
  <div class="form-row" id="dmr" style="display:${h?'flex':'none'}"><span class="form-lb">暴露域名${req}</span><input class="form-in" id="f_dm" value="${escapeHtml(r.domain||'')}" placeholder="域名"></div>
  <div class="form-row" id="tkr" style="display:${(h||s)?'flex':'none'}"><span class="form-lb">访问账户</span><input class="form-in" id="f_tk" value="${escapeHtml(r.token||'')}" placeholder="user:pass"></div>
  <div class="form-row"><span class="form-lb">备注</span><input class="form-in" id="f_ds" value="${escapeHtml(r.description||'')}" placeholder="备注"></div>`;
}
function tpf() {
  const pt = document.getElementById('f_pt').value;
  const h = pt === 'HTTP';
  const s = pt === 'SOCKS5';
  const hideLocal = s;
  document.getElementById('lir').style.display = hideLocal ? 'none' : 'flex';
  document.getElementById('lpr').style.display = hideLocal ? 'none' : 'flex';
  document.getElementById('rpr').style.display = h ? 'none' : 'flex';
  document.getElementById('dmr').style.display = h ? 'flex' : 'none';
  document.getElementById('tkr').style.display = (h || s) ? 'flex' : 'none';
}
function gfv() {
  return { proxyType: document.getElementById('f_pt').value, localIp: document.getElementById('f_ip').value||'127.0.0.1',
    localPort: parseInt(document.getElementById('f_lp').value)||0, remotePort: parseInt(document.getElementById('f_rp').value)||0,
    domain: document.getElementById('f_dm').value, token: document.getElementById('f_tk').value, description: document.getElementById('f_ds').value };
}

function showAddDialog() {
  if (started) { showTip('请先关闭连接'); return; }
  showModal('新增映射配置', proxyForm({proxyType:'TCP',localIp:'127.0.0.1'}), async () => {
    const v = gfv();
    const err = await go.AddProxyConfig(v.proxyType, v.localIp, v.localPort, v.remotePort, v.domain, v.token, v.description);
    if (err) { showFormErr(err); return; }
    cfg.push(v); render(); closeModal();
    toast('配置已添加', 'ok');
  }, false, ICO.edit);
}
function showEditDialog(idx) {
  if (started) { showTip('请先关闭连接'); return; }
  showModal('修改映射配置', proxyForm(cfg[idx]), async () => {
    const v = gfv();
    const err = await go.UpdateProxyConfig(idx, v.proxyType, v.localIp, v.localPort, v.remotePort, v.domain, v.token, v.description);
    if (err) { showFormErr(err); return; }
    cfg[idx] = v; render(); closeModal();
    toast('配置已更新', 'ok');
  }, false, ICO.edit);
}

// ==================== Server Config Dialog ====================
async function showServerDialog() {
  const c = await go.GetConfig();
  _srvInfo = c.serverIp + ':' + c.serverPort;
  showModal('连接配置', `
    <div class="form-row"><span class="form-lb">服务端地址<span class="form-req">*</span></span><input class="form-in" id="s_ip" value="${escapeHtml(c.serverIp)}"></div>
    <div class="form-row"><span class="form-lb">服务端端口<span class="form-req">*</span></span><input class="form-in" id="s_port" type="number" value="${c.serverPort}"></div>
    <div class="form-row"><span class="form-lb">连接秘钥<span class="form-req">*</span></span><input class="form-in" id="s_key" value="${escapeHtml(c.clientKey||'')}"></div>
    <div class="form-row"><span class="form-lb">证书文件</span><div class="file-row"><input class="form-in" id="s_cert" value="${escapeHtml(c.certFile)}"><button class="btn btn-sm" onclick="pickFile('s_cert','选择证书文件')">选择</button></div></div>
    <div class="form-row"><span class="form-lb">密钥文件</span><div class="file-row"><input class="form-in" id="s_keyf" value="${escapeHtml(c.keyFile)}"><button class="btn btn-sm" onclick="pickFile('s_keyf','选择密钥文件')">选择</button></div></div>
    <div class="form-row"><span class="form-lb">CA文件</span><div class="file-row"><input class="form-in" id="s_ca" value="${escapeHtml(c.caFile)}"><button class="btn btn-sm" onclick="pickFile('s_ca','选择CA文件')">选择</button></div></div>`,
  async () => {
    await go.SaveServerConfig(
      document.getElementById('s_ip').value, parseInt(document.getElementById('s_port').value)||0,
      document.getElementById('s_key').value, document.getElementById('s_cert').value,
      document.getElementById('s_keyf').value, document.getElementById('s_ca').value);
    closeModal();
    refreshSrvInfo();
    toast('连接配置已保存', 'ok');
  }, false, ICO.info);
}
async function pickFile(inputId, title) {
  const f = await go.SelectFile(title);
  if (f) document.getElementById(inputId).value = f;
}

// ==================== About ====================
async function showAbout() {
  const ver = await go.GetVersion();
  showModal('关于', `<div style="text-align:center;padding:14px 0 4px">
    <div style="font-size:19px;font-weight:700;margin-bottom:4px">Reverse Proxy Tool</div>
    <div style="color:var(--text-2);margin-bottom:14px;font-size:13px">Version ${escapeHtml(ver)}</div>
    <div><a href="#" onclick="go.OpenURL('https://github.com/iamlinhui/rpt');return false" style="color:var(--primary);cursor:pointer;font-size:13px">github.com/iamlinhui/rpt</a></div>
    <div style="color:var(--text-3);margin-top:14px;font-size:12px">Powered By Lynn</div></div>`, closeModal, true, ICO.info);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
